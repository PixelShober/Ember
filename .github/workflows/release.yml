name: Release

# Every merge to main that changes the app creates a GitHub release automatically:
# version from the PR title, Ember.exe (self-contained), the UI package for live updates,
# latest.json for the updater and SHA256SUMS.txt. Docs-only changes do not create a release.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version erzwingen (z. B. 1.4.0) – leer = aus dem PR-Titel'
        required: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release erstellen
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Version bestimmen
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          FORCED: ${{ inputs.version }}
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          pr=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" --jq '.[0]' 2>/dev/null || echo '{}')
          [ -z "$pr" ] && pr='{}'
          title=$(jq -r '.title // empty' <<<"$pr")
          number=$(jq -r '.number // empty' <<<"$pr")
          [ -z "$title" ] && title=$(git log -1 --pretty=%s)

          if [ -z "$FORCED" ] && [ -n "$last" ] && git diff --quiet "$last" HEAD -- src ui config Directory.Build.props global.json; then
            echo "Seit $last hat sich an der App nichts geändert – kein Release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "$FORCED" ]; then version="${FORCED#v}"; else version=$(PR_TITLE="$title" node scripts/next-version.mjs "$last"); fi

          # Did the exe's code change? If not, older installations only fetch the new UI (no restart).
          code_version="$version"
          if [ -n "$last" ] && git diff --quiet "$last" HEAD -- src Directory.Build.props global.json; then
            code_version=$(gh release download "$last" -p latest.json -O - 2>/dev/null | jq -r '.exe.codeVersion // empty')
            [ -z "$code_version" ] && code_version="$version"
          fi

          mkdir -p release/out
          printf '%s' "$title" > release/title.txt
          jq -r '.body // empty' <<<"$pr" > release/body.md
          {
            echo "release=true"
            echo "version=$version"
            echo "code_version=$code_version"
            echo "last=$last"
            echo "pr=$number"
          } >> "$GITHUB_OUTPUT"
          echo "Version $version (Exe-Code $code_version, vorher ${last:-–})"

      - uses: actions/setup-node@v7
        if: steps.version.outputs.release == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: actions/setup-dotnet@v6
        if: steps.version.outputs.release == 'true'
        with:
          dotnet-version: 10.0.x

      - name: Oberfläche bauen
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        working-directory: ui
        run: |
          node -e "const fs=require('fs');const f='public/ui-manifest.json';const m=JSON.parse(fs.readFileSync(f,'utf8'));m.version=process.env.VERSION;fs.writeFileSync(f,JSON.stringify(m,null,2)+'\n')"
          npm ci
          npm test
          npm run build
          node ../scripts/check-encoding.mjs

      - name: Tests
        if: steps.version.outputs.release == 'true'
        run: dotnet test tests/Ember.Core.Tests -c Release

      - name: Ember.exe bauen
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node scripts/check-deps.mjs
          dotnet publish src/Ember.App/Ember.App.csproj -c Release -o release/exe "-p:Version=$VERSION"
          cp release/exe/Ember.exe release/out/Ember.exe

      - name: UI-Paket packen
        if: steps.version.outputs.release == 'true'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: Compress-Archive -Path ui/dist/* -DestinationPath "release/out/ember-ui-$env:VERSION.zip"

      - name: latest.json, Prüfsummen und Notizen
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CODE_VERSION: ${{ steps.version.outputs.code_version }}
          PR: ${{ steps.version.outputs.pr }}
        run: |
          node scripts/make-manifest.mjs --version "$VERSION" --code-version "$CODE_VERSION" \
            --exe release/out/Ember.exe --ui "release/out/ember-ui-$VERSION.zip" \
            --notes "https://github.com/${GITHUB_REPOSITORY}/releases/tag/v$VERSION" --out release/out
          {
            echo "## $(cat release/title.txt)"
            [ -n "$PR" ] && echo "" && echo "Aus Pull Request #$PR."
            echo ""
            cat release/body.md
            echo ""
            echo "### Installation"
            echo ""
            echo "\`Ember.exe\` herunterladen und starten. Ember kopiert sich nach \`C:\\Ember\\App\` und legt einen Startmenü-Eintrag an. Installierte Versionen aktualisieren sich selbst."
            if [ "$CODE_VERSION" != "$VERSION" ]; then
              echo ""
              echo "Dieses Release ändert nur die Oberfläche: laufende Installationen laden sie ohne Neustart nach."
            fi
          } > release/notes.md

      - name: Release veröffentlichen
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" release/out/* \
            --title "Ember $VERSION" --notes-file release/notes.md --target "$GITHUB_SHA"
